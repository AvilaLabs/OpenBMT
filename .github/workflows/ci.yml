name: CI

on:
  push:
    branches: [main, 'train/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: build and test (Rust 1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - run: cargo test --workspace --locked

  key-kotlin-decoder:
    name: Key Kotlin/JVM OBM9 decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified Kotlin compiler 2.2.20
        shell: bash
        run: |
          archive="$RUNNER_TEMP/kotlin-compiler-2.2.20.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          # SHA-256 published in JetBrains' v2.2.20 release asset metadata.
          echo "81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420  $archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kotlin"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin"
          kotlin_home="$RUNNER_TEMP/kotlin/kotlinc"
          test -f "$kotlin_home/lib/annotations-13.0.jar"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "KOTLIN_HOME=$kotlin_home" >> "$GITHUB_ENV"
          echo "KOTLIN_COMPILER_CP=$kotlin_home/lib/*" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB_JAR=$kotlin_home/lib/kotlin-stdlib.jar" >> "$GITHUB_ENV"
          echo "KOTLIN_ANNOTATIONS_JAR=$kotlin_home/lib/annotations-13.0.jar" >> "$GITHUB_ENV"
      - name: Run Key binding decoder harness
        run: crates/openbmt-key-ffi/bindings/tests/run-jvm.sh
      - name: Run Counter binding decoder harness
        run: crates/openbmt-counter-ffi/bindings/tests/run-jvm.sh
      - name: Run Owner binding decoder harness
        run: crates/openbmt-owner-ffi/bindings/tests/run-jvm.sh

  qr-crosscheck:
    name: QR encoder against ZXing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      # Downloads the ZXing jar and refuses one whose SHA-256 is not the
      # pinned value in the script.
      - name: Cross-check against ZXing
        run: scripts/qr-crosscheck.sh

  ur-crosscheck:
    name: BC-UR against Hummingbird
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Cache verified Hummingbird jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openbmt/tools/hummingbird/*.jar
          key: ur-crosscheck-${{ runner.os }}-${{ hashFiles('scripts/ur-crosscheck.sh') }}
      # Downloads the Hummingbird and CBOR jars and refuses one whose
      # SHA-256 is not the pinned value in the script.
      - name: Cross-check against Hummingbird
        run: scripts/ur-crosscheck.sh

  deps:
    name: dependency lists, sources, licences, advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch the locked packages
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Lists, sources and licences
        run: scripts/deps-check.sh
      - name: Every framed encoding has a magic of its own
        run: scripts/magic-check.sh
      - name: Advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

  keymaker:
    name: Key maker tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/keymaker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.1
      - name: Install the packages pinned by the lockfile
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Build the page
        run: node build.mjs
      - name: Bundle tests
        run: node --test test/bundle.test.js
      - name: Release built twice, byte for byte
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cache=$(npm config get cache)
          for n in 1 2; do
            git worktree add --detach "$RUNNER_TEMP/release-$n" HEAD
          done
          mkdir "$RUNNER_TEMP/home-2"
          (cd "$RUNNER_TEMP/release-1" && npm_config_cache="$cache" scripts/keymaker-release.sh 0.0.0-ci)
          (cd "$RUNNER_TEMP/release-2" && umask 077 && HOME="$RUNNER_TEMP/home-2" npm_config_cache="$cache" scripts/keymaker-release.sh 0.0.0-ci)
          name=openbmt-keymaker-0.0.0-ci.html
          cmp "$RUNNER_TEMP/release-1/tools/keymaker/dist/release/$name" "$RUNNER_TEMP/release-2/tools/keymaker/dist/release/$name"
          cmp "$RUNNER_TEMP/release-1/tools/keymaker/dist/release/SHA256SUMS" "$RUNNER_TEMP/release-2/tools/keymaker/dist/release/SHA256SUMS"
      - name: Checks that stay local
        run: |
          echo "Skipped here: the Electrum cross-check (test/electrum/crosscheck.sh needs Electrum's own files and bwrap) and the browser run (KEYMAKER_BROWSER=1 needs a browser). Both run on the maintainer's machine."
