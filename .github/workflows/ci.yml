name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: build and test (Rust 1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - run: cargo test --workspace --locked

  key-kotlin-decoder:
    name: Key Kotlin/JVM OBM9 decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified Kotlin compiler 2.2.20
        shell: bash
        run: |
          archive="$RUNNER_TEMP/kotlin-compiler-2.2.20.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          # SHA-256 published in JetBrains' v2.2.20 release asset metadata.
          echo "81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420  $archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kotlin"
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin"
          kotlin_home="$RUNNER_TEMP/kotlin/kotlinc"
          test -f "$kotlin_home/lib/annotations-13.0.jar"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "KOTLIN_HOME=$kotlin_home" >> "$GITHUB_ENV"
          echo "KOTLIN_COMPILER_CP=$kotlin_home/lib/*" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB_JAR=$kotlin_home/lib/kotlin-stdlib.jar" >> "$GITHUB_ENV"
          echo "KOTLIN_ANNOTATIONS_JAR=$kotlin_home/lib/annotations-13.0.jar" >> "$GITHUB_ENV"
      - name: Run Key binding decoder harness
        run: crates/openbmt-key-ffi/bindings/tests/run-jvm.sh
      - name: Run Counter binding decoder harness
        run: crates/openbmt-counter-ffi/bindings/tests/run-jvm.sh
      - name: Run Owner binding decoder harness
        run: crates/openbmt-owner-ffi/bindings/tests/run-jvm.sh

  qr-crosscheck:
    name: QR encoder against ZXing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      # Downloads the ZXing jar and refuses one whose SHA-256 is not the
      # pinned value in the script.
      - name: Cross-check against ZXing
        run: scripts/qr-crosscheck.sh

  ur-crosscheck:
    name: BC-UR against Hummingbird
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      # Downloads the Hummingbird and CBOR jars and refuses one whose
      # SHA-256 is not the pinned value in the script.
      - name: Cross-check against Hummingbird
        run: scripts/ur-crosscheck.sh

  deps:
    name: dependency lists, sources, licences, advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch the locked packages
        run: cargo fetch --locked
      - name: Lists, sources and licences
        run: scripts/deps-check.sh
      - name: Every framed encoding has a magic of its own
        run: scripts/magic-check.sh
      - name: Advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

  box-image:
    name: Box container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f packaging/box/Dockerfile -t openbmt-box:ci .
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker volume create box-smoke-data
          docker run -d --name box-smoke --init --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m \
            --health-interval 2s --health-start-period 2s \
            -v box-smoke-data:/data -p 127.0.0.1:18986:8986 \
            openbmt-box:ci
          listening() {
            for _ in $(seq 1 30); do
              if (exec 3<>/dev/tcp/127.0.0.1/18986) 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs box-smoke
            return 1
          }
          # It listens.
          listening
          docker logs box-smoke | grep -q '^listening: 0.0.0.0:8986$'
          key="$(docker logs box-smoke | sed -n 's/^key: //p')"
          test -n "$key"
          # It runs as the fixed non-root user.
          test "$(docker exec box-smoke id -u)" = 1000
          test "$(docker exec box-smoke id -g)" = 1000
          # The root file system is read-only; /data is writable.
          if docker exec box-smoke touch /nope 2>/dev/null; then
            echo "root file system is writable"
            exit 1
          fi
          docker exec box-smoke touch /data/probe
          docker exec box-smoke rm /data/probe
          # The health check passes.
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' box-smoke)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          # A stop is SIGTERM through the init: the Box has no handler, so
          # it ends with 143 (128 + 15); 0 is accepted too.
          docker stop box-smoke
          code="$(docker inspect -f '{{.State.ExitCode}}' box-smoke)"
          echo "exit code $code"
          case "$code" in 0|143) ;; *) docker logs box-smoke; exit 1 ;; esac
          # Started again, it listens with its data intact: the same key
          # read back from /data, and a second state line with no error
          # before it (a damaged file would stop the start).
          docker start box-smoke
          listening
          test "$(docker exec box-smoke ls /data | grep -c '^box.key$')" = 1
          docker logs box-smoke
          test "$(docker logs box-smoke | grep -c '^state: ')" = 2
          test "$(docker logs box-smoke | grep -c "^key: $key\$")" = 2
          test "$(docker inspect -f '{{.State.Running}}' box-smoke)" = true
          docker stop box-smoke
          docker rm box-smoke
          docker volume rm box-smoke-data
