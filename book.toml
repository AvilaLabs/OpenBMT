[book]
title = "OpenBMT Handbook"
authors = ["Avila Labs"]
description = "A merchant's guide to Bitcoin checkout with OpenBMT, with detailed technical references."
language = "en"
src = "docs/handbook"

[build]
build-dir = "dist/handbook"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/AvilaLabs/OpenBMT"
edit-url-template = "https://github.com/AvilaLabs/OpenBMT/edit/main/{path}"
site-url = "/"

[output.html.playground]
runnable = false
