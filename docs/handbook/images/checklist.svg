<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A checklist of the habits above.</title>
<rect x="0.5" y="0.5" width="479" height="579" rx="16" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<rect x="16" y="16" width="448" height="290" rx="12" fill="#F4F5F7" stroke="#E2E5EA" stroke-width="1" />
<rect x="16" y="318" width="448" height="246" rx="12" fill="#F4F5F7" stroke="#E2E5EA" stroke-width="1" />
<text x="40" y="56" font-size="24" font-weight="bold" text-anchor="start" fill="#12805C">Built in</text>
<circle cx="54" cy="102" r="13" fill="#12805C" stroke="none" stroke-width="1"/>
<path d="M 47.5 102 L 52.5 107.5 L 61.5 96.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="109" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Straight to a cold wallet</text>
<circle cx="54" cy="146" r="13" fill="#12805C" stroke="none" stroke-width="1"/>
<path d="M 47.5 146 L 52.5 151.5 L 61.5 140.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="153" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Counter cannot spend</text>
<circle cx="54" cy="190" r="13" fill="#12805C" stroke="none" stroke-width="1"/>
<path d="M 47.5 190 L 52.5 195.5 L 61.5 184.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="197" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">New address every sale</text>
<circle cx="54" cy="234" r="13" fill="#12805C" stroke="none" stroke-width="1"/>
<path d="M 47.5 234 L 52.5 239.5 L 61.5 228.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="241" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Large sales wait for a block</text>
<circle cx="54" cy="278" r="13" fill="#12805C" stroke="none" stroke-width="1"/>
<path d="M 47.5 278 L 52.5 283.5 L 61.5 272.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="285" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Value recorded for tax</text>
<text x="40" y="358" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Yours to do</text>
<rect x="41" y="391" width="26" height="26" rx="5" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<text x="78" y="411" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Check the first address</text>
<rect x="41" y="435" width="26" height="26" rx="5" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<text x="78" y="455" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Words on steel, away from the shop</text>
<rect x="41" y="479" width="26" height="26" rx="5" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<text x="78" y="499" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">Someone you trust can recover</text>
<rect x="41" y="523" width="26" height="26" rx="5" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<text x="78" y="543" font-size="20" font-weight="normal" text-anchor="start" fill="#111317">More than one key for savings</text>
