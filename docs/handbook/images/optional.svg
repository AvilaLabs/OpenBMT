<g transform="translate(64.0 74.0) scale(1.0)"><rect x="-30" y="-8" width="60" height="48" rx="5" fill="#E7E9EE" stroke="#5B616B" stroke-width="2.5" /><rect x="-34" y="-20" width="68" height="16" rx="4" fill="#FFFFFF" stroke="#5B616B" stroke-width="2.5" /><line x1="-10" y1="16" x2="10" y2="16" stroke="#5B616B" stroke-width="3" stroke-linecap="round" /></g>
<path d="M 32 224 v 12 a 32 11 0 0 0 64 0 v -12" fill="#E7E9EE" stroke="#5B616B" stroke-width="2.5"/><ellipse cx="64" cy="224" rx="32" ry="11" fill="#FFFFFF" stroke="#5B616B" stroke-width="2.5"/>
<path d="M 32 204 v 12 a 32 11 0 0 0 64 0 v -12" fill="#E7E9EE" stroke="#5B616B" stroke-width="2.5"/><ellipse cx="64" cy="204" rx="32" ry="11" fill="#FFFFFF" stroke="#5B616B" stroke-width="2.5"/>
<path d="M 32 184 v 12 a 32 11 0 0 0 64 0 v -12" fill="#E7E9EE" stroke="#5B616B" stroke-width="2.5"/><ellipse cx="64" cy="184" rx="32" ry="11" fill="#FFFFFF" stroke="#5B616B" stroke-width="2.5"/>
<polygon points="72,286 42,324 61,324 55,360 87,316 67,316" fill="#5B616B"/>
<text x="124" y="54" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">The Box</text>
<text x="124" y="84" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Till sends amounts</text>
<text x="124" y="110" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">to the counter</text>
<text x="124" y="180" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Your own node</text>
<text x="124" y="210" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Checks each payment</text>
<text x="124" y="236" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">yourself</text>
<text x="124" y="306" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Lightning</text>
<text x="124" y="336" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Fast, low fees for</text>
<text x="124" y="362" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">small sales</text>
<rect x="346.75" y="24.75" width="108.5" height="30.5" rx="15" fill="#FFFFFF" stroke="#5B616B" stroke-width="1.5" />
<text x="401" y="46" font-size="18" font-weight="bold" text-anchor="middle" fill="#5B616B">Optional</text>
