<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 408" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The Box, your own Bitcoin node and Lightning, each optional.</title>
