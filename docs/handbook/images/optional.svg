<text x="401" y="172" font-size="18" font-weight="bold" text-anchor="middle" fill="#5B616B">Optional</text>
<rect x="346.75" y="276.75" width="108.5" height="30.5" rx="15" fill="#FFFFFF" stroke="#5B616B" stroke-width="1.5" />
<text x="401" y="298" font-size="18" font-weight="bold" text-anchor="middle" fill="#5B616B">Optional</text>
