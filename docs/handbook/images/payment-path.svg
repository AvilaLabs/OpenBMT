<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The customer's wallet pays your wallet directly. The counter watches and tells the cashier.</title>
<rect x="0.5" y="0.5" width="719" height="379" rx="16" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<rect x="90" y="40" width="60" height="110" rx="10" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" />
<rect x="112.0" y="45" width="16" height="4" rx="2" fill="#4A505A" stroke="none" stroke-width="1" />
<rect x="96" y="54" width="48" height="86" rx="4" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<text x="120" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#111317">Customer's wallet</text>
<rect x="572" y="52" width="56" height="76" rx="8" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" />
<rect x="580" y="60" width="40" height="28.88" rx="3" fill="#FFFFFF" stroke="#4A505A" stroke-width="1.5" />
<circle cx="590.6666666666666" cy="112" r="5" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5"/>
<circle cx="609.3333333333334" cy="112" r="5" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5"/>
<text x="600" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#111317">Your wallet</text>
<line x1="190" y1="95" x2="529.2" y2="95" stroke="#12805C" stroke-width="10" stroke-linecap="butt" />
<polygon points="540,95 522,82.4 522,107.6" fill="#12805C"/>
<text x="365" y="76" font-size="18" font-weight="bold" text-anchor="middle" fill="#12805C">bitcoin</text>
<text x="300" y="126" font-size="15" font-weight="normal" text-anchor="middle" fill="#4A505A">No company in between</text>
<rect x="380" y="222" width="120" height="84" rx="9" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" />
<circle cx="493" cy="264.0" r="2.5" fill="#4A505A" stroke="none" stroke-width="1"/>
<rect x="386" y="228" width="100" height="72" rx="3" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<text x="440" y="334" font-size="16" font-weight="bold" text-anchor="middle" fill="#111317">Counter</text>
<line x1="440" y1="216" x2="440" y2="106" stroke="#5B616B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<polygon points="440,104 434,116 446,116" fill="#5B616B"/>
<text x="452" y="168" font-size="15" font-weight="normal" text-anchor="start" fill="#5B616B">watches</text>
<rect x="262" y="236" width="84" height="38" rx="10" fill="#E7F6EF" stroke="#12805C" stroke-width="2" />
<polygon points="346,248 366,258 346,264" fill="#E7F6EF"/>
<line x1="346" y1="249" x2="346" y2="263" stroke="#E7F6EF" stroke-width="3" stroke-linecap="round" />
<text x="304" y="261" font-size="16" font-weight="bold" text-anchor="middle" fill="#12805C">Paid</text>
<rect x="600.0" y="236" width="60.0" height="26" rx="4" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<rect x="580" y="270" width="100" height="40" rx="6" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" />
<rect x="590" y="294" width="80" height="10" rx="3" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5" />
<line x1="610.0" y1="262" x2="610.0" y2="270" stroke="#4A505A" stroke-width="2" stroke-linecap="round" />
<line x1="650.0" y1="262" x2="650.0" y2="270" stroke="#4A505A" stroke-width="2" stroke-linecap="round" />
<text x="630" y="350" font-size="15" font-weight="bold" text-anchor="middle" fill="#111317">Till records the sale</text>
</svg>
