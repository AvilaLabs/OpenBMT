<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The customer's wallet pays your wallet directly. The counter watches and tells the cashier.</title>
<rect x="0.5" y="0.5" width="479" height="499" rx="16" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<g transform="translate(78.0 24.0) scale(0.9)"><rect x="0" y="0" width="60" height="110" rx="10" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" /><rect x="22.0" y="5" width="16" height="4" rx="2" fill="#4A505A" stroke="none" stroke-width="1" /><rect x="6" y="14" width="48" height="86" rx="4" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" /></g>
<text x="16" y="160" font-size="20" font-weight="bold" text-anchor="start" fill="#111317">Customer's wallet</text>
<g transform="translate(372.0 30.0) scale(1.0)"><rect x="0" y="0" width="56" height="76" rx="8" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" /><rect x="8" y="8" width="40" height="28.88" rx="3" fill="#FFFFFF" stroke="#4A505A" stroke-width="1.5" /><circle cx="18.666666666666668" cy="60" r="5" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5"/><circle cx="37.333333333333336" cy="60" r="5" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5"/></g>
<text x="464" y="160" font-size="20" font-weight="bold" text-anchor="end" fill="#111317">Your wallet</text>
<line x1="150" y1="80" x2="339.2" y2="80" stroke="#12805C" stroke-width="10" stroke-linecap="butt" />
<polygon points="350,80 332,67.4 332,92.6" fill="#12805C"/>
<text x="250" y="54" font-size="22" font-weight="bold" text-anchor="middle" fill="#12805C">bitcoin</text>
<text x="234" y="108" font-size="20" font-weight="normal" text-anchor="middle" fill="#4A505A">No company</text>
<text x="234" y="130" font-size="20" font-weight="normal" text-anchor="middle" fill="#4A505A">in between</text>
<g transform="translate(264.0 214.0) scale(1.0)"><rect x="0" y="0" width="120" height="84" rx="9" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" /><circle cx="113" cy="42.0" r="2.5" fill="#4A505A" stroke="none" stroke-width="1"/><rect x="6" y="6" width="100" height="72" rx="3" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" /></g>
<text x="324" y="326" font-size="20" font-weight="bold" text-anchor="middle" fill="#111317">Counter</text>
<line x1="324" y1="208" x2="324" y2="92" stroke="#5B616B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<polygon points="324,90 317,104 331,104" fill="#5B616B"/>
<text x="312" y="198" font-size="20" font-weight="normal" text-anchor="end" fill="#5B616B">watches</text>
<rect x="120" y="232" width="100" height="46" rx="12" fill="#E7F6EF" stroke="#12805C" stroke-width="2" />
<polygon points="220,244 244,256 220,266" fill="#E7F6EF"/>
<line x1="220" y1="246" x2="220" y2="264" stroke="#E7F6EF" stroke-width="3" stroke-linecap="round" />
<text x="170" y="264" font-size="22" font-weight="bold" text-anchor="middle" fill="#12805C">Paid</text>
<g transform="translate(190.0 356.0) scale(1.0)"><rect x="20.0" y="0" width="60.0" height="26" rx="4" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" /><rect x="0" y="34" width="100" height="40" rx="6" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" /><rect x="10" y="58" width="80" height="10" rx="3" fill="#E7E9EE" stroke="#4A505A" stroke-width="1.5" /><line x1="30.0" y1="26" x2="30.0" y2="34" stroke="#4A505A" stroke-width="2" stroke-linecap="round" /><line x1="70.0" y1="26" x2="70.0" y2="34" stroke="#4A505A" stroke-width="2" stroke-linecap="round" /></g>
<text x="240" y="470" font-size="20" font-weight="bold" text-anchor="middle" fill="#111317">Till records the sale</text>
</svg>
