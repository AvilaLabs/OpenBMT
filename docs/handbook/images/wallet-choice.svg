<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 652" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Do you have a cold wallet? Yes: connect it. No: make one with a coin or a die. Not now: set up the rest first.</title>
<rect x="0.5" y="0.5" width="479" height="651" rx="16" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1" />
<rect x="40" y="16" width="400" height="56" rx="10" fill="#F4F5F7" stroke="#4A505A" stroke-width="2" />
<text x="240" y="53" font-size="24" font-weight="bold" text-anchor="middle" fill="#111317">Do you have a cold wallet?</text>
<line x1="240" y1="72" x2="240" y2="92" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<line x1="24" y1="92" x2="240" y2="92" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<line x1="24" y1="92" x2="24" y2="510.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<line x1="24" y1="193.0" x2="34" y2="193.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<text x="40" y="201.0" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Yes</text>
<line x1="150" y1="193.0" x2="166" y2="193.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<polygon points="178,193.0 164,185.0 164,201.0" fill="#4A505A"/>
<rect x="180" y="118" width="284" height="150" rx="12" fill="#F4F5F7" stroke="#E2E5EA" stroke-width="1" />
<line x1="24" y1="361.0" x2="34" y2="361.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<text x="40" y="369.0" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">No</text>
<line x1="150" y1="361.0" x2="166" y2="361.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<polygon points="178,361.0 164,353.0 164,369.0" fill="#4A505A"/>
<rect x="180" y="286" width="284" height="150" rx="12" fill="#F4F5F7" stroke="#E2E5EA" stroke-width="1" />
<line x1="24" y1="510.0" x2="34" y2="510.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<text x="40" y="518.0" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Not now</text>
<line x1="150" y1="510.0" x2="166" y2="510.0" stroke="#4A505A" stroke-width="3" stroke-linecap="round" />
<polygon points="178,510.0 164,502.0 164,518.0" fill="#4A505A"/>
<rect x="180" y="454" width="284" height="112" rx="12" fill="#F4F5F7" stroke="#E2E5EA" stroke-width="1" />
<text x="196" y="160" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Connect it</text>
<text x="196" y="192" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Scan its code</text>
<text x="196" y="218" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Compare the</text>
<text x="196" y="244" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">first address</text>
<rect x="308" y="106" width="146" height="30" rx="15" fill="#12805C" stroke="none" stroke-width="1" />
<text x="381" y="127" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Recommended</text>
<text x="196" y="328" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Make one</text>
<text x="196" y="360" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Coin or die,</text>
<text x="196" y="386" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">offline laptop</text>
<text x="196" y="416" font-size="20" font-weight="bold" text-anchor="start" fill="#4A505A">About an hour</text>
<circle cx="386" cy="390" r="17" fill="#E7E9EE" stroke="#4A505A" stroke-width="2"/>
<circle cx="386" cy="390" r="12" fill="none" stroke="#6B7280" stroke-width="1.5"/>
<rect x="414" y="376" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4A505A" stroke-width="2" />
<circle cx="422.4" cy="384.4" r="2.6" fill="#4A505A" stroke="none" stroke-width="1"/>
<circle cx="435.6" cy="384.4" r="2.6" fill="#4A505A" stroke="none" stroke-width="1"/>
<circle cx="429.0" cy="391.0" r="2.6" fill="#4A505A" stroke="none" stroke-width="1"/>
<circle cx="422.4" cy="397.6" r="2.6" fill="#4A505A" stroke="none" stroke-width="1"/>
<circle cx="435.6" cy="397.6" r="2.6" fill="#4A505A" stroke="none" stroke-width="1"/>
<text x="196" y="496" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Set up the rest</text>
<text x="196" y="528" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Counter says:</text>
<text x="196" y="554" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Not taking bitcoin yet</text>
<rect x="16" y="590" width="448" height="46" rx="10" fill="#ECEEF1" stroke="none" stroke-width="1" />
<text x="240" y="620" font-size="18" font-weight="normal" text-anchor="middle" fill="#5B616B">Hot wallet on a phone: small amounts only</text>
</svg>
