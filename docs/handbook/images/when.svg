<text x="124" y="52" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Once</text>
<text x="124" y="82" font-size="20" font-weight="normal" text-anchor="start" fill="#4A505A">Steps 1 to 5</text>
<text x="124" y="108" font-size="20" font-weight="bold" text-anchor="start" fill="#12805C">About two hours</text>
<text x="124" y="174" font-size="24" font-weight="bold" text-anchor="start" fill="#111317">Every sale</text>
