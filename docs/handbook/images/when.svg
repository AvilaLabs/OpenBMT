<circle cx="64" cy="72" r="30" fill="#12805C" stroke="none" stroke-width="1"/>
<text x="64" y="83" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
<path d="M 77.5 170.6 A 27 27 0 1 1 46.6 173.3" fill="none" stroke="#12805C" stroke-width="6" stroke-linecap="round"/>
<polygon points="57.4,164.3 53.7,181.7 39.6,164.9" fill="#12805C"/>
