[package]
name = "openbmt-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The same exact version as openbmt-core, for the network enum.
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
openbmt-core = { path = "../crates/openbmt-core" }
openbmt-signer = { path = "../crates/openbmt-signer" }
openbmt-spend = { path = "../crates/openbmt-spend" }
openbmt-watch = { path = "../crates/openbmt-watch" }
openbmt-net = { path = "../crates/openbmt-net" }
# The same exact version as openbmt-net, for the peer's side of the handshake.
bip324 = { version = "=0.11.1", default-features = false }
openbmt-counter = { path = "../crates/openbmt-counter" }
openbmt-counter-node = { path = "../crates/openbmt-counter-node" }
openbmt-counter-ffi = { path = "../crates/openbmt-counter-ffi" }
openbmt-link = { path = "../crates/openbmt-link" }
openbmt-courier = { path = "../crates/openbmt-courier" }
openbmt-pos = { path = "../crates/openbmt-pos" }
openbmt-books = { path = "../crates/openbmt-books" }
openbmt-session = { path = "../crates/openbmt-session" }
openbmt-approver = { path = "../crates/openbmt-approver" }
openbmt-owner = { path = "../crates/openbmt-owner" }
openbmt-owner-ffi = { path = "../crates/openbmt-owner-ffi" }
openbmt-owner-node = { path = "../crates/openbmt-owner-node" }
openbmt-key-ffi = { path = "../crates/openbmt-key-ffi" }
openbmt-lock = { path = "../crates/openbmt-lock" }
openbmt-qr = { path = "../crates/openbmt-qr" }
openbmt-rates = { path = "../crates/openbmt-rates" }
openbmt-requests = { path = "../crates/openbmt-requests" }
openbmt-ur = { path = "../crates/openbmt-ur" }
openbmt-stick = { path = "../crates/openbmt-stick" }
openbmt-lightning-node = { path = "../crates/openbmt-lightning-node", features = ["testing"] }
openbmt-bbqr = { path = "../crates/openbmt-bbqr" }
openbmt-qr-jni = { path = "../crates/openbmt-qr-jni" }
openbmt-json = { path = "../crates/openbmt-json" }
openbmt-pos-readers = { path = "../crates/openbmt-pos-readers" }
openbmt-box = { path = "../crates/openbmt-box" }
openbmt-lightning = { path = "../crates/openbmt-lightning", features = ["testing"] }
openbmt-swap = { path = "../crates/openbmt-swap" }
# The same exact version as openbmt-key-ffi, for the word list.
bip39 = { version = "=2.2.2", default-features = false, features = ["std"] }

