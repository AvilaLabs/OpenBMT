[package]
name = "openbmt-recovery-investigation"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
openbmt-lightning-node = { path = "../../../crates/openbmt-lightning-node" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std", "secp-recovery"] }
lightning = { version = "=0.2.8", features = ["std"] }
lightning-persister = { version = "=0.2.8", features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
