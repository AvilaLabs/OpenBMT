[package]
name = "openbmt-bbqr"
description = "BBQr (Coinkite's animated QR format) with no dependencies: write base32 parts, read hex, base32 and zlib parts in any order"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependencies of any kind: the base32 and the inflate (RFC 1950 and
# 1951) are written here, so that the apps that show or read a sequence of
# codes add nothing to their package lists. The words of the refusals are
# checked against the screen rules with openbmt-core, a development
# dependency that no program is built with.
[dependencies]

[dev-dependencies]
openbmt-core = { path = "../openbmt-core" }
