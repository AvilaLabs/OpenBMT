[package]
name = "openbmt-counter-node"
description = "The OpenBMT counter without a screen: the counter's judgment of a sale joined to the network driver and to files on disk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Shop Lightning's node (and with it tokio). On by default; the build for a
# browser turns it off and the counter then offers no Lightning of its own.
default = ["network"]
network = ["dep:openbmt-lightning-node", "dep:tokio"]

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
openbmt-core = { path = "../openbmt-core" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-counter = { path = "../openbmt-counter" }
openbmt-courier = { path = "../openbmt-courier" }
openbmt-link = { path = "../openbmt-link" }
# For the paid notices a counter sends to a Box (BX-40).
openbmt-pos = { path = "../openbmt-pos" }
# The shop's own Lightning node (CR-112 to CR-116).
openbmt-lightning = { path = "../openbmt-lightning" }
# Shop Lightning's node (SL-70 to SL-78): the counter that the settings name
# runs it, and talks to the Box with Store and Stored messages. tokio is the
# runtime the node needs, at the version the node pins.
openbmt-lightning-node = { path = "../openbmt-lightning-node", optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "sync"], optional = true }

[dev-dependencies]
# The signing wallet and the signatures of a wallet message (AP-14).
openbmt-core = { path = "../openbmt-core", features = ["test-support"] }
