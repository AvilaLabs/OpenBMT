[package]
name = "openbmt-counter-node"
description = "The OpenBMT counter without a screen: the counter's judgment of a sale joined to the network driver and to files on disk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
openbmt-core = { path = "../openbmt-core" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-counter = { path = "../openbmt-counter" }
openbmt-courier = { path = "../openbmt-courier" }
openbmt-link = { path = "../openbmt-link" }
# For the paid notices a counter sends to a Box (BX-40).
openbmt-pos = { path = "../openbmt-pos" }
# The shop's own Lightning node (CR-112 to CR-116).
openbmt-lightning = { path = "../openbmt-lightning" }
# Lightning through a swap provider (CR-218 to CR-226).
openbmt-swap = { path = "../openbmt-swap" }

[dev-dependencies]
# The recorded replies and the invoice writer of the tests.
openbmt-lightning = { path = "../openbmt-lightning", features = ["testing"] }
# The pretend swap service and the regtest node of the tests (SW-90).
openbmt-swap = { path = "../openbmt-swap", features = ["testing"] }
# The owner phone's check of a refund (CR-224), in the end-to-end test.
openbmt-owner = { path = "../openbmt-owner" }
