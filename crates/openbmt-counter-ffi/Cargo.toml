[package]
name = "openbmt-counter-ffi"
description = "The OpenBMT counter node as a library the counter app for Android calls: one safe dispatch over framed requests, a registry of handles, and every rule left in the existing crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The JNI entry point, compiled for every target so that the host can test
# it; on Android it is always compiled.
default = ["jni"]
jni = []

# The same exact versions as the other crates, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-counter = { path = "../openbmt-counter" }
openbmt-counter-node = { path = "../openbmt-counter-node" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-qr = { path = "../openbmt-qr" }
openbmt-rates = { path = "../openbmt-rates" }
# The invoice's code (LN-18) and the credential of the setup.
openbmt-lightning = { path = "../openbmt-lightning" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
# The JNI types, nothing else. 0.3.0 has no dependencies of its own; the
# later releases (0.3.1, 0.4) depend on a macro crate and syn.
jni-sys = "=0.3.0"

[dev-dependencies]
# The other ends of the pairing ceremony, for the test that runs it whole.
openbmt-approver = { path = "../openbmt-approver" }
openbmt-owner = { path = "../openbmt-owner" }
openbmt-signer = { path = "../openbmt-signer" }
# The recorded replies and the invoice writer of the Lightning tests.
openbmt-lightning = { path = "../openbmt-lightning", features = ["testing"] }
# The relay and the owner's end of the link, for the tests of the link.
openbmt-link = { path = "../openbmt-link" }
openbmt-courier = { path = "../openbmt-courier" }
