[package]
name = "openbmt-pos-readers"
description = "The readers of three POS vendors' orders (Square, Clover, Loyverse): the text of each request and the strict reading of each reply into a page of POS orders. No network, no clock, no sign-in"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Path dependencies inside the workspace only: the POS model and its words
# (pos), the JSON reader (json), the currency type of a POS order (counter)
# and the words a person is shown (core). No external package.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-counter = { path = "../openbmt-counter" }
openbmt-json = { path = "../openbmt-json" }
openbmt-pos = { path = "../openbmt-pos" }
