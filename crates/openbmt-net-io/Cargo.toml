[package]
name = "openbmt-net-io"
description = "The OpenBMT counter's network driver: owns the sockets, the threads and the stored address book and headers, and runs the sans-IO peer manager over them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }

# The driver runs the net crate's manager and address book, and keeps the
# watcher's header store on disk.
openbmt-net = { path = "../openbmt-net" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-core = { path = "../openbmt-core" }

# The tests' fake peer speaks the encrypted transport with the same crate
# that the net crate uses.
[dev-dependencies]
bip324 = { version = "=0.11.1", default-features = false }

# NR-99: the driver's own tests make an own node at a clear-net address on
# this machine, for the check against Bitcoin Core on regtest. The feature is
# off in every build of a program; only this dev-dependency turns it on.
openbmt-net = { path = "../openbmt-net", features = ["clear-own-node-for-tests"] }
