[package]
name = "openbmt-approver"
description = "The OpenBMT Key app's side of the approval session: open a request, show what its own checks say line by line, sign what the person approves, and store before it answers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as openbmt-core, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-signer = { path = "../openbmt-signer" }
openbmt-session = { path = "../openbmt-session" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }

[dev-dependencies]
openbmt-spend = { path = "../openbmt-spend" }
