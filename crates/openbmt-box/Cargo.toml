[package]
name = "openbmt-box"
description = "The OpenBMT Box, the merchant's own small server: its pairing by invitation, its device list, its relay and its storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-link = { path = "../openbmt-link" }
openbmt-courier = { path = "../openbmt-courier" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-pos = { path = "../openbmt-pos" }
# The readers of the two vendors the Box reads (BX-49).
openbmt-pos-readers = { path = "../openbmt-pos-readers" }
# For the shop's money (an amount and a currency) in what the Box stores.
openbmt-counter = { path = "../openbmt-counter" }

[[bin]]
name = "openbmt-box"
path = "src/main.rs"
