[package]
name = "openbmt-net"
description = "The OpenBMT counter's Bitcoin peer client: wire framing, the single-peer session and the peer manager, with no sockets and no clock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }

# The address book groups peers by the watcher's network groups (WR-41) and
# writes its stored form with the core's framed encoding. The regtest peer
# example feeds the headers it receives to the watcher's header store.
openbmt-core = { path = "../openbmt-core" }

# The manager feeds the headers it receives to the watcher's header store
# and checks the blocks with the watcher's rules.
openbmt-watch = { path = "../openbmt-watch" }

# The encrypted transport (NR-80 to NR-85): the key exchange and the packet
# ciphers of BIP324, with no I/O of their own. Pinned exactly: 0.11.1 is the
# first version whose key encoding is not a fingerprint. The `std` feature is
# off, because the randomness comes from the caller.
bip324 = { version = "=0.11.1", default-features = false }
