[package]
name = "openbmt-counter"
description = "The OpenBMT counter's judgment of a sale: which address a sale gets, when Bitcoin may be accepted, and what the cashier sees"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as openbmt-core, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-watch = { path = "../openbmt-watch" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
