[package]
name = "openbmt-qr-jni"
description = "The QR reader of openbmt-qr and the QR drawing and UR sequences of openbmt-ur as two JNI functions for the Android apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

# The reader, the encoder and the UR sequences of this workspace and nothing
# else. The JNI table is declared by hand in `src/jni.rs`, so no crate of the
# JNI types is needed.
[dependencies]
openbmt-qr = { path = "../openbmt-qr" }
openbmt-ur = { path = "../openbmt-ur" }
