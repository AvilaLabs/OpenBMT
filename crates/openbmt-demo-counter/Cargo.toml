[package]
name = "openbmt-demo-counter"
description = "The OpenBMT web demo's counter: the counter app's own library (the counter node and its framed calls) compiled to WebAssembly, on a chain simulated in memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library is the one the Android app calls, without its network side
# (the `network` feature of the two counter crates): the page gives the
# driver, the time and the random bytes.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-counter = { path = "../openbmt-counter" }
openbmt-counter-ffi = { path = "../openbmt-counter-ffi", default-features = false }
openbmt-counter-node = { path = "../openbmt-counter-node", default-features = false }
openbmt-demo = { path = "../openbmt-demo", default-features = false }
openbmt-kernel-random = { path = "../openbmt-kernel-random" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-watch = { path = "../openbmt-watch" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
