[package]
name = "openbmt-lightning-node"
description = "Shop Lightning: the shop's own receive-only Lightning node on the LDK library (docs/SHOP-LIGHTNING-RULES.md). The key from the shop's words by BIP-85, every change of state stored on two devices, chain data from the shop's own Bitcoin Core, channels from a provider the shop picks through LSPS2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The LDK library, at exact versions and never forked or patched. ldk-node is
# not used here (SL-02). lightning-block-sync 0.2.0 is the release that goes
# with lightning 0.2.8 (there is no 0.2.8 of it). The bitcoin crate is at the
# version the rest of the workspace pins. ChaCha20-Poly1305 is the package the
# link and the lock already list, with the same features.
#
# openbmt-core is here for the shop's pinned wallet (`PinnedWallet`, WL-20): the
# node derives the address the sweep, the splice out and the close pay to
# from the shop's wallet description, the way the counter does (SL-33). It
# adds miniscript and bip39, which the counter's list already has.
#
# openbmt-link is the shop's own link: the second device is the Box, reached
# with Store and Stored messages (SL-74). It adds no external package. The
# Box crate is a dev-dependency, for the tests that run the Box's store.
#
# openbmt-net-io, openbmt-net and openbmt-watch are the counter's own peer
# layer: the compact-filter watcher of SL-26 runs on the driver and its header
# store, and the Tor stream of SL-32 is made by its SOCKS5 client. They add no
# package the counter's list does not have.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-link = { path = "../openbmt-link" }
openbmt-net-io = { path = "../openbmt-net-io" }
openbmt-watch = { path = "../openbmt-watch" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std", "secp-recovery"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
lightning = { version = "=0.2.8", features = ["std"] }
lightning-background-processor = { version = "=0.2.3" }
lightning-block-sync = { version = "=0.2.0", features = ["rpc-client", "tokio"] }
lightning-invoice = { version = "=0.34.2", features = ["std"] }
lightning-liquidity = { version = "=0.2.8" }
lightning-net-tokio = { version = "=0.2.0" }
lightning-rapid-gossip-sync = { version = "=0.2.3" }
lightning-persister = { version = "=0.2.8", features = ["tokio"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }

[dev-dependencies]
openbmt-box = { path = "../openbmt-box" }

# The plain TCP device is for tests and for the end-to-end script, never for
# an app (SL-74). Only the two tools below turn it on.
[features]
tcp-device = []
# Re-encoding hooks for the fuzz targets, which cannot reach the private decoders.
testing = []

[[bin]]
name = "shop-lightning-device"
path = "src/bin/device.rs"
required-features = ["tcp-device"]

[[example]]
name = "shop_regtest"
path = "examples/shop_regtest.rs"
required-features = ["tcp-device"]
