[package]
name = "openbmt-owner"
description = "The OpenBMT owner phone's side of the approval session: the refund queue, cash-out, batches, settings and pairings, the request it builds and the response it takes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as openbmt-core, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-signer = { path = "../openbmt-signer" }
openbmt-spend = { path = "../openbmt-spend" }
openbmt-session = { path = "../openbmt-session" }
openbmt-ur = { path = "../openbmt-ur" }
openbmt-json = { path = "../openbmt-json" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
# The same pin as openbmt-core: the 12 words of the refund float (FL-01) and
# of the starter wallet (SS-04).
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc"] }
# The same pin and features as openbmt-link and openbmt-lock: the sealed
# seed of the starter wallet (SS-20). It is in the lock file already.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
# The web order key (WO-43): Ed25519 signatures of the owner phone, the one
# package the web order rules add. No default features: no random number
# generator, no encodings; only signing and wiping the seed on drop.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }

# The kernel's bytes with the checks of SS-02, shared with every other key the
# Rust side makes.
openbmt-kernel-random = { path = "../openbmt-kernel-random" }

[dev-dependencies]
openbmt-approver = { path = "../openbmt-approver" }
openbmt-bbqr = { path = "../openbmt-bbqr" }
