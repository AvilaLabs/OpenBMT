[package]
name = "openbmt-owner-node"
description = "The owner's watcher without a screen: a network driver of its own, the real health rules, and the signed heartbeat for the counter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The counter node's network side (Shop Lightning's node and tokio), which the
# owner's node does not use itself. On by default; the build for a browser
# turns it off.
default = ["network"]
network = ["openbmt-counter-node/network"]

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
openbmt-core = { path = "../openbmt-core" }
openbmt-kernel-random = { path = "../openbmt-kernel-random" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-net-io = { path = "../openbmt-net-io" }
# For `ChainView` and `DriverPort`, which the two nodes share.
openbmt-counter-node = { path = "../openbmt-counter-node", default-features = false }
openbmt-courier = { path = "../openbmt-courier" }
openbmt-link = { path = "../openbmt-link" }
# The refund requests in a counter's records, and the owner's queue they go to.
openbmt-counter = { path = "../openbmt-counter" }
openbmt-owner = { path = "../openbmt-owner" }
openbmt-session = { path = "../openbmt-session" }
# For `Coin` and the spend rules the coin view serves.
openbmt-spend = { path = "../openbmt-spend" }
# Key 1's signer, which finishes the owner's own transactions.
openbmt-signer = { path = "../openbmt-signer" }
# The owner's payment requests: the book, quotes, payments, repeats, returns.
openbmt-requests = { path = "../openbmt-requests" }
# The sources of the price and the rule that makes one rate of their replies,
# the same as the counter's (a path dependency; no external package).
openbmt-rates = { path = "../openbmt-rates" }

[dev-dependencies]
# The Key app, in process, for the tests that build and take a session.
openbmt-approver = { path = "../openbmt-approver" }
# For the test that the node's weight limit is the net crate's.
openbmt-net = { path = "../openbmt-net" }
