[package]
name = "openbmt-owner-node"
description = "The owner's watcher without a screen: a network driver of its own, the real health rules, and the signed heartbeat for the counter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same exact bitcoin version as the other crates, so the types unify.
[dependencies]
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
openbmt-core = { path = "../openbmt-core" }
openbmt-watch = { path = "../openbmt-watch" }
openbmt-net-io = { path = "../openbmt-net-io" }
# For `ChainView` and `DriverPort`, which the two nodes share.
openbmt-counter-node = { path = "../openbmt-counter-node" }
openbmt-courier = { path = "../openbmt-courier" }
openbmt-link = { path = "../openbmt-link" }
# For the Box's POS notices (BX-42).
openbmt-pos = { path = "../openbmt-pos" }
# The refund requests in a counter's records, and the owner's queue they go to.
openbmt-counter = { path = "../openbmt-counter" }
openbmt-owner = { path = "../openbmt-owner" }
openbmt-session = { path = "../openbmt-session" }

[dev-dependencies]
# For the owner's wallet in the tests of the refund intake, and the two
# crates whose lists of payable scripts the counter's list must agree with.
openbmt-signer = { path = "../openbmt-signer" }
openbmt-spend = { path = "../openbmt-spend" }
