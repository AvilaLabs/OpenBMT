[package]
name = "openbmt-key-ffi"
description = "The OpenBMT Key app's core as a library an Android app calls through UniFFI: one object, a storage callback, and every rule left in the existing crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The bindings generator, built only when asked for (`scripts/key-ffi-build.sh`).
bindgen = ["uniffi/cli"]

# The same exact versions as the other crates, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-approver = { path = "../openbmt-approver" }
openbmt-session = { path = "../openbmt-session" }
openbmt-signer = { path = "../openbmt-signer" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["std"] }
# No default features: the cargo-metadata one pulls in crates newer than Rust 1.89.
uniffi = { version = "=0.32.2", default-features = false }

[dev-dependencies]
openbmt-owner = { path = "../openbmt-owner" }
openbmt-spend = { path = "../openbmt-spend" }
