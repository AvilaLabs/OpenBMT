[package]
name = "openbmt-key-ffi"
description = "The OpenBMT Key app's core as a library an Android app calls: one object, a storage trait, and every rule left in the existing crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

# The same exact versions as the other crates, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-approver = { path = "../openbmt-approver" }
openbmt-session = { path = "../openbmt-session" }
openbmt-signer = { path = "../openbmt-signer" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
openbmt-owner = { path = "../openbmt-owner" }
openbmt-spend = { path = "../openbmt-spend" }
