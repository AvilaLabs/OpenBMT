[package]
name = "openbmt-key-ffi"
description = "The OpenBMT Key app's core as a library an Android app calls: one object, a storage trait, and every rule left in the existing crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The JNI entry point, compiled for every target so that the host can test
# it; on Android it is always compiled.
default = ["jni"]
jni = []
# A test's fixed random blocks in place of the kernel's, through
# `KeyStore::test_block`. For other crates' tests only; a shipped build leaves
# it off.
test-random = []

# The same exact versions as the other crates, so the types unify.
[dependencies]
openbmt-core = { path = "../openbmt-core" }
openbmt-approver = { path = "../openbmt-approver" }
openbmt-session = { path = "../openbmt-session" }
openbmt-signer = { path = "../openbmt-signer" }
bitcoin = { version = "=0.32.8", default-features = false, features = ["std"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc"] }
# The JNI types, nothing else. 0.3.0 has no dependencies of its own; the
# later releases (0.3.1, 0.4) depend on a macro crate and syn.
jni-sys = "=0.3.0"
# The PIN lock (SR-71) is the shared crate, which holds Argon2 and
# ChaCha20-Poly1305: no package of its own is added here.
openbmt-lock = { path = "../openbmt-lock" }
# The kernel's random bytes with the checks of SS-02: every key, identity,
# salt and nonce is made from them, never from bytes the app passes in.
openbmt-kernel-random = { path = "../openbmt-kernel-random" }

[dev-dependencies]
openbmt-owner = { path = "../openbmt-owner" }
openbmt-spend = { path = "../openbmt-spend" }
