manifestVersion: 1
id: openbmt-box
storage:
  dataRoot: data
category: bitcoin
name: OpenBMT Box
version: "0.1.0"
tagline: The shop's own small server for taking bitcoin at the counter
description: >-
  First run: the Box has no web page and no login. It is paired from the Key
  app. Make an invitation in the Key app, save its 30 characters as the file
  invitation.txt in this app's data folder, restart the app, and then enter
  the Box's address (this Umbrel's address and port 8986) in the owner's
  phone. The Box reads the file once and deletes it; the invitation is good
  for 30 minutes.


  The OpenBMT Box is the relay between a shop's devices and the place where
  the counters' paid notices are matched to the point-of-sale system. It holds
  no bitcoin key, derives no address, checks no payment and cannot move funds.
  Whoever has its data folder has its identity key, so back that folder up as
  one would a password file.
