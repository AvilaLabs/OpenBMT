category: bitcoin
name: OpenBMT Box
version: "0.1.0"
tagline: The shop's own small server for taking bitcoin at the counter
description: >-
  First run: open the app. Its page shows whether the Box is paired. Make an
  invitation in the Key app (30 characters, good for 30 minutes), type it in
  the box on the page, and then enter the Box's address, which the page
  shows (this Umbrel's address and port 8986), in the owner's phone. The page
  is behind Umbrel's login; the shop's devices do not use it, they connect to
  port 8986 directly. An invitation can also be saved as the file
  invitation.txt in this app's data folder before the app starts.


  The OpenBMT Box is the relay between a shop's devices and the place where
  the counters' paid notices are matched to the point-of-sale system. It holds
  no bitcoin key, derives no address, checks no payment and cannot move funds.
  Whoever has its data folder has its identity key, so back that folder up as
  one would a password file.
