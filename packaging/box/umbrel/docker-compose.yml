# The Box speaks its own framing over raw TCP, not HTTP, so there is no
# app_proxy: the port is published on the host as it is.
services:
  server:
    image: openbmt-box:0.1.0
    restart: on-failure
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # An invitation is given as a file under /data (BX-12). The Box reads it
    # once and deletes it; with no file it says so in its log and runs on.
    command: ["--invitation-file", "/data/invitation.txt"]
    ports:
      - "8986:8986/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
